<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Me</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    dt { font-weight: 600; margin-top: 1rem; }
    dd { margin: .25rem 0 0; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <nav><a href="/dashboard.html">Dashboard</a><a href="/about.html">About Me</a><a href="/users.html">Users</a></nav>
  <h1>About Me</h1>
  <dl>
    <dt>Username</dt><dd id="username">Loading...</dd>
    <dt>Email</dt><dd id="email"></dd>
    <dt>Bio</dt><dd id="bio"></dd>
  </dl>
  <button id="logout">Log out</button>

  <script src="/js/api.js"></script>
  <script>
    apiGet("/api/users/about-me").then((u) => {
      document.getElementById("username").textContent = u.username;
      document.getElementById("email").textContent = u.email;
      document.getElementById("bio").textContent = u.bio || "No bio yet.";
    });
  </script>
</body>
</html>
