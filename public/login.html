<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Log In</h1>

    <div id="message" class="message" role="alert" hidden></div>

    <!-- novalidate lets empty fields reach the server so its 400 response is shown -->
    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username">
        <p id="username-error" class="field-error" hidden></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <p id="password-error" class="field-error" hidden></p>
      </div>
      <button class="btn" type="submit">Log In</button>
    </form>

    <p class="alt">Don't have an account?</p>
    <a class="btn" href="signup.html">Create an Account</a>
  </main>

  <script src="auth.js"></script>
  <script>setupAuthForm('login-form', '/api/login');</script>
</body>
</html>
