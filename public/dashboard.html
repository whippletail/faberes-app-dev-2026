<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <nav><a href="/dashboard.html">Dashboard</a><a href="/about.html">About Me</a><a href="/users.html">Users</a></nav>
  <h1 id="greeting">Loading...</h1>
  <p id="details"></p>
  <button id="logout">Log out</button>

  <script src="/js/api.js"></script>
  <script>
    apiGet("/api/users/me").then((user) => {
      document.getElementById("greeting").textContent = `Hello, ${user.username}`;
      document.getElementById("details").textContent = `Signed in as ${user.email}`;
    });
  </script>
</body>
</html>
